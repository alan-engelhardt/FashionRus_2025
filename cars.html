<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cars</title>
</head>

<body>
    <h1>Biler</h1>

    <section id="carlist">
        <article class="card">
            <img src="image" alt="model">
            <h2>brand</h2>
            <h3>model</h3>
            <p>motor</p>
            <p>range</p>
            <p>color</p>
        </article>
    </section>

    <script>
        const carlist = document.querySelector("#carlist");

        const cars = [
            {
                brand: "VW",
                model: "ID4",
                motor: "EL",
                udstyr: ["Soltag", "18' alufælge"],
                colors: ["Rød", "Grøn", "blå"],
                image: "VW_ID4.webp"
            },
            {
                brand: "BMW",
                model: "X5",
                motor: "Diesel",
                udstyr: ["Adaptiv fartpilot", "Turbolader", "Kopholder"],
                colors: ["Sort", "Søvl"],
                image: "BMW_X5.webp"
            },
            {
                brand: "Citroën",
                model: "C4",
                motor: "Bensin",
                udstyr: ["Radio", "CD afspiller"],
                colors: ["sølv", "Orange", "Lilla"],
                image: "C4.webp"
            }
        ]

        function showCars(cars) {
            console.log(cars)
            let markup = "";
            cars.forEach(car => markup += `
            <article class="card">
                <img src="images/${car.image}" alt="${car.model}">
                <h3>${car.model}</h3>
                <h2>${car.brand}</h2>
                <p>${car.motor}</p>
                <p>${car.udstyr}</p>
                <p>${car.colors.join(", ")}</p>
            </article>
            `)
            carlist.innerHTML = markup;
        }

        showCars(cars);
    </script>
</body>

</html>
