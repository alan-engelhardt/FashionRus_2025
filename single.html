<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>user</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            color: light-dark(#111, #eee);
            background-color: light-dark(#eee, #111);
            font-family: system-ui, sans-serif;
            padding: 1rem;
        }
    </style>
</head>

<body>
    <a href="test.html">Back</a>
    <h1>Test</h1>
    <main></main>
</body>
<script>
    const id = new URLSearchParams(window.location.search).get("id");
    fetch(`https://dummyjson.com/users/${id}`)
        .then(res => res.json())
        .then(show);

    function show(user) {
        console.log(user);
        document.querySelector("h1").textContent = user.firstName;
        let markup = `               
                <article>
                <img src="images/${user.id}/a.webp" alt="profile image">
                <img src="images/${user.id}/b.webp" alt="profile image">
                <img src="images/${user.id}/c.webp" alt="profile image">
                </article>`
        document.querySelector("main").innerHTML = markup;
    }
</script>

</html>
